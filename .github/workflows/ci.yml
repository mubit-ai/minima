name: CI — PR checks

# Gate on every PR to main (and on push to main) with the exact local test
# conventions: server (ruff + offline pytest) and TUI (bun test + tsc). Two
# independent jobs so a red on one surfaces without masking the other. No
# deploy, no secrets — the suites are offline (`-m "not live and not eval"`).
# mypy runs after ruff/pytest: src/minima is now type-clean, so it gates too.
on:
  pull_request:
    branches: [main, feat/boosting, research/new-features-research]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  server:
    name: Server — ruff + pytest + mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync deps (dev extra)
        run: uv sync --extra dev

      - name: Venv integrity (installed files match wheel RECORD)
        run: uv run python scripts/verify_venv_integrity.py

      - name: Ruff
        run: uv run ruff check src client_sdk tests

      - name: Pytest (offline)
        run: uv run pytest -m "not live and not eval" -q

      - name: Mypy
        run: uv run mypy src/minima

  tui:
    name: TUI — bun test + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tui
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The default engine for grep/glob is ripgrep; without it the rg-path tests
      # (test.if(RG !== null)) silently skip and CI only ever exercises the fallbacks.
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep

      - name: Verify ripgrep present
        run: command -v rg && rg --version

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

  # `MINIMA_TUI_<X>=0` is the published rollback for every default-ON harness behavior, and
  # until now it was verified once by hand on one machine. This job runs the whole suite with
  # every switch engaged, so "turn it off" keeps working. NOTE: most switches resolve through
  # configFromEnv, which main.ts calls once at startup, and most tests inject their own
  # config — so for those the durable gate is tests/kill-switches.test.ts, which pins the
  # contract directly, and this job is the belt-and-braces half. Three switches
  # (PLAN_CRITIC, DIFF_REVIEW, AUTO_GATES) are read AMBIENTLY at their wiring sites, so for
  # those this job is not redundant: it is the only place the suite runs with them off.
  tui-flags-off:
    name: TUI — kill-switch matrix (every switch off)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tui
    env:
      MINIMA_TUI_BIG_PLAN: "0"
      MINIMA_TUI_IMAGES: "0"
      MINIMA_TUI_NOTIFY: "0"
      MINIMA_TUI_MEMORY: "0"
      MINIMA_TUI_ARTIFACTS: "0"
      MINIMA_TUI_ARTIFACT_GC_MB: "0"
      MINIMA_TUI_BGJOBS: "0"
      MINIMA_TUI_COMPACT2: "0"
      MINIMA_TUI_CONTEXT_METER: "0"
      MINIMA_TUI_STEER: "0"
      MINIMA_TUI_REWIND: "0"
      MINIMA_TUI_GIT_COMMIT: "0"
      MINIMA_TUI_COMMIT_LEDGER: "0"
      MINIMA_TUI_EDIT_GUARD: "0"
      MINIMA_TUI_TYPED_TASK: "0"
      MINIMA_TUI_PLAN_PREMIUM: "0"
      MINIMA_TUI_FAILURE_MATCHER: "0"
      MINIMA_TUI_TOOL_ALLOWLIST: "0"
      MINIMA_TUI_GRADED_OUTCOME: "0"
      MINIMA_TUI_EDITOR: "0"
      MINIMA_TUI_KEYMAP: "0"
      # These four used to be ambient reads that only this job could cover. They resolve
      # through configFromEnv now, so tests/kill-switches.test.ts asserts each one reaches
      # its field; they stay here because this job also proves the features tolerate being
      # off end to end, which a config assertion cannot show.
      MINIMA_TUI_PLAN_CRITIC: "0"
      MINIMA_TUI_DIFF_REVIEW: "0"
      MINIMA_TUI_AUTO_GATES: "0"
      MINIMA_TUI_DASHBOARD: "0"
      # Matrix symmetry only: the env-layer loader takes its environment by injection, so its
      # suite passes `env` explicitly and never reads this. The gate that matters is the
      # behavioral one in tests/kill-switches.test.ts.
      MINIMA_TUI_PROJECT_CONFIG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Same rg install as the `tui` job: without it the rg-path tests skip, and a
      # flags-off run that exercises fewer tests than the default run is not a matrix.
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test with every kill switch engaged
        run: bun test

  sdk-ts:
    name: TS SDK — bun test + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint
